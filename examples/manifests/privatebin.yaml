# PrivateBin (https://github.com/PrivateBin/docker-nginx-fpm-alpine) on every node, all sharing one
# RWX claim. Its Filesystem storage keeps one small file per paste plus a server salt and the traffic
# limiter state under /srv/data, no database. The Service spreads requests over every node with no
# session affinity: a paste created through one node is read through another.
#
# Each node mounts the claim with its own mount pod. Install the chart with the shared Redis cache
# (examples/helm-values/redis-values.yaml), so that every mount pod sees the others' pastes at once; with the
# default memory cache, each mount pod keeps its own listings, and another node's paste may not be
# found for up to the cache TTL (1 min by default, csi.retycfs.com/cache-ttl).
#
# Apply and browse the ingress controller's address (k3s ships Traefik): the rule has no host, so
# it catches every request.
apiVersion: v1
kind: Namespace
metadata:
  name: privatebin
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: privatebin-data
  namespace: privatebin
  labels:
    app: privatebin
  annotations:
    # Owner of every file of the volume: the UID and GID PrivateBin runs as (securityContext below).
    csi.retycfs.com/uid: "65534"
    csi.retycfs.com/gid: "82"
    # Performance tuning
    csi.retycfs.com/background-delete: "true"
    csi.retycfs.com/unsafe-write: "true"
spec:
  accessModes: [ReadWriteMany]
  storageClassName: retycfs-rwx
  resources:
    requests:
      storage: 1Gi
---
# PrivateBin purges expired pastes while it handles a paste creation, at most every [purge] limit
# seconds: it reads every paste to find the expired ones, one API round trip each, which stalls
# that request for seconds on a cold cache. The CronJob at the end purges instead. A limit below 1
# does not disable the purge but runs it on every creation (PurgeLimiter::canPurge): ten years it
# is. Absent or empty sections keep PrivateBin's defaults.
apiVersion: v1
kind: ConfigMap
metadata:
  name: privatebin-config
  namespace: privatebin
  labels:
    app: privatebin
data:
  conf.php: |
    ;<?php http_response_code(403); /*
    [main]

    [model]
    class = Filesystem

    [model_options]

    [purge]
    limit = 315360000
    batchsize = 10
    ;*/
---
apiVersion: v1
kind: Service
metadata:
  name: privatebin
  namespace: privatebin
  labels:
    app: privatebin
spec:
  ports:
    - port: 80
      targetPort: http
      name: http
  selector:
    app: privatebin
---
# One pod per node: as many mount pods of the claim as nodes.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: privatebin
  namespace: privatebin
  labels:
    app: privatebin
spec:
  selector:
    matchLabels:
      app: privatebin
  template:
    metadata:
      labels:
        app: privatebin
    spec:
      automountServiceAccountToken: false
      # No fsGroup: the driver declares fsGroupPolicy None. The volume belongs to the claim's
      # csi.retycfs.com/uid and gid, so the pods run as exactly that UID to write.
      securityContext:
        runAsUser: 65534
        runAsGroup: 82
      containers:
        - name: privatebin
          image: ghcr.io/privatebin/fs:2.0.6
          ports:
            - containerPort: 8080
              name: http
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /srv/data
              # Lets the pod see the volume again when the node plugin restarts (doc/architecture.md).
              mountPropagation: HostToContainer
            # The only other writable paths with a read-only root filesystem.
            - name: tmp
              mountPath: /tmp
            - name: run
              mountPath: /run
            - name: nginx-tmp
              mountPath: /var/lib/nginx/tmp
            - name: config
              mountPath: /srv/cfg
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: privatebin-data
        - name: tmp
          emptyDir:
            medium: Memory
        - name: run
          emptyDir:
            medium: Memory
        - name: nginx-tmp
          emptyDir: {}
        - name: config
          configMap:
            name: privatebin-config
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: privatebin
  namespace: privatebin
  labels:
    app: privatebin
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: privatebin
                port:
                  name: http
---
# Purges the expired pastes outside of user requests (see the ConfigMap).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: privatebin-purge
  namespace: privatebin
  labels:
    app: privatebin
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: privatebin-purge
        spec:
          restartPolicy: OnFailure
          automountServiceAccountToken: false
          securityContext:
            runAsUser: 65534
            runAsGroup: 82
          containers:
            - name: purge
              image: ghcr.io/privatebin/fs:2.0.6
              # The script raises PHP 8.5 deprecation notices (upstream, harmless): kept out of the logs.
              command: ["php", "-d", "error_reporting=E_ALL & ~E_DEPRECATED", "/srv/bin/administration", "--purge"]
              securityContext:
                readOnlyRootFilesystem: true
                allowPrivilegeEscalation: false
              volumeMounts:
                - name: data
                  mountPath: /srv/data
                - name: config
                  mountPath: /srv/cfg
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: privatebin-data
            - name: config
              configMap:
                name: privatebin-config
            - name: tmp
              emptyDir:
                medium: Memory
