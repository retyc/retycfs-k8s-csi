# A namespace bringing its own Retyc account. Copy, fill in the Secret, apply: the claim is
# provisioned in *that* account, and mounted with it, through the retycfs-rwx-tenant class. The
# Secret's name is fixed by the StorageClass parameters (the chart's storageClasses value).
apiVersion: v1
kind: Namespace
metadata:
  name: team-a
---
apiVersion: v1
kind: Secret
metadata:
  name: retycfs-credentials
  namespace: team-a
type: Opaque
stringData:
  RETYC_TOKEN: "replace-with-offline-token"          # retyc auth login --offline, on the team's account
  RETYC_KEY_PASSPHRASE: "replace-with-key-passphrase"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: team-data
  namespace: team-a
  annotations:
    csi.retycfs.com/uid: "1000"   # owner of the files: the UID the pods below run as
spec:
  accessModes: [ReadWriteMany]
  storageClassName: retycfs-rwx-tenant
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: team-writer
  namespace: team-a
spec:
  securityContext:
    runAsUser: 1000
    runAsGroup: 1000
  containers:
    - name: writer
      image: busybox:1.36
      command: ["sh", "-c", "while true; do date >> /data/log.txt; sleep 5; done"]
      volumeMounts:
        - name: data
          mountPath: /data
          # Lets the pod see the volume again when the node plugin restarts (doc/architecture.md).
          mountPropagation: HostToContainer
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: team-data
---
apiVersion: v1
kind: Pod
metadata:
  name: team-reader
  namespace: team-a
spec:
  securityContext:
    runAsUser: 1000
    runAsGroup: 1000
  containers:
    - name: reader
      image: busybox:1.36
      command: ["sh", "-c", "while true; do echo \"--- $(date)\"; tail -n 3 /data/log.txt; sleep 5; done"]
      volumeMounts:
        - name: data
          mountPath: /data
          # Lets the pod see the volume again when the node plugin restarts (doc/architecture.md).
          mountPropagation: HostToContainer
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: team-data
