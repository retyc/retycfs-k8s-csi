# A namespace with its own Retyc machine account. Apply the RetycIdentity, have an administrator of
# the Retyc organization approve it (Organization > Machines, after comparing the fingerprint):
#
#   kubectl -n team-a get retycidentity default -o wide
#
# The claim is then provisioned by that machine and mounted with it, through the retycfs-rwx-tenant
# class. A claim created before the approval stays Pending, with an event giving the fingerprint.
# The keys land in the Secret retycfs-identity-team-a of the driver's namespace, which the tenant
# cannot read. The RetycIdentity must be named "default".
apiVersion: v1
kind: Namespace
metadata:
  name: team-a
---
apiVersion: csi.retycfs.com/v1alpha1
kind: RetycIdentity
metadata:
  name: default
  namespace: team-a
# Optional with identity.organizationID set on the chart. Immutable: it cannot be added, changed
# or removed after creation (another organization means another RetycIdentity).
# spec:
#   organizationID: REPLACE-WITH-ORGANIZATION-UUID
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: team-data
  namespace: team-a
  annotations:
    csi.retycfs.com/uid: "1000"   # owner of the files: the UID the pods below run as
    # People added to the dataroom when it is created, never re-applied (role admin, editor or
    # viewer, the default). Keep a human admin: see "Dataroom lifecycle" in doc/configuration.md.
    # csi.retycfs.com/initial-members: "alice@example.com:admin,bob@example.com:editor"
spec:
  accessModes: [ReadWriteMany]
  storageClassName: retycfs-rwx-tenant
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: team-writer
  namespace: team-a
spec:
  securityContext:
    runAsUser: 1000
    runAsGroup: 1000
  containers:
    - name: writer
      image: busybox:1.36
      command: ["sh", "-c", "while true; do date >> /data/log.txt; sleep 5; done"]
      volumeMounts:
        - name: data
          mountPath: /data
          # Lets the pod see the volume again when the node plugin restarts (doc/architecture.md).
          mountPropagation: HostToContainer
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: team-data
---
apiVersion: v1
kind: Pod
metadata:
  name: team-reader
  namespace: team-a
spec:
  securityContext:
    runAsUser: 1000
    runAsGroup: 1000
  containers:
    - name: reader
      image: busybox:1.36
      command: ["sh", "-c", "while true; do echo \"--- $(date)\"; tail -n 3 /data/log.txt; sleep 5; done"]
      volumeMounts:
        - name: data
          mountPath: /data
          # Lets the pod see the volume again when the node plugin restarts (doc/architecture.md).
          mountPropagation: HostToContainer
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: team-data
