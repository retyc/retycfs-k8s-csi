# Re-adopt an existing dataroom (e.g. one left behind by a retycfs-rwx-retain PVC, or created by
# hand) as a static PV. The CSI volume handle is the dataroom ID, from `retyc --json dataroom ls`.
#
# The mount settings are read at stage from volumeAttributes, with the same keys as the PVC
# annotations (csi.retycfs.com/uid is mandatory: every file of the mount belongs to it, and only a pod
# running with that UID can write). Add pvcName and pvcNamespace to have the claim's annotations
# read too: they win over volumeAttributes. The chart's ValidatingAdmissionPolicy requires
# csi.retycfs.com/uid on every claim of its StorageClasses, so the claim below carries it as well.
#
# On a tenant StorageClass (one with node-stage secrets, such as retycfs-rwx-tenant), the PV must
# name the tenant's Secret itself (nodeStageSecretRef below): kubelet reads it from the PV, not
# from the class. Without it the node plugin refuses the stage (FailedPrecondition) rather than
# mount the dataroom with the driver's cluster-wide identity.
#
# Static PVs are never deleted by the provisioner (no provisioned-by annotation), so
# reclaimPolicy: Retain is the honest value here — Delete would leave a Released PV with a
# dataroom nobody removes.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: retycfs-adopted
spec:
  accessModes: [ReadWriteMany]
  capacity:
    storage: 1Gi
  persistentVolumeReclaimPolicy: Retain
  storageClassName: retycfs-rwx-retain
  csi:
    driver: csi.retycfs.com
    volumeHandle: REPLACE-WITH-DATAROOM-ID        # e.g. 01a06bd5-45b6-7489-bc18-04990d98b0c2
    volumeAttributes:
      csi.retycfs.com/uid: "1000"                   # owner of the files: the UID the consumer pods run as
      # csi.retycfs.com/gid: "1000"                 # optional, defaults to the UID
    # Tenant class only: the tenant's credentials, in the claim's namespace.
    # nodeStageSecretRef:
    #   name: retycfs-credentials
    #   namespace: REPLACE-WITH-CLAIM-NAMESPACE
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: retycfs-adopted
  annotations:
    csi.retycfs.com/uid: "1000"
spec:
  accessModes: [ReadWriteMany]
  storageClassName: retycfs-rwx-retain
  volumeName: retycfs-adopted      # pin to the PV above instead of provisioning a new dataroom
  resources:
    requests:
      storage: 1Gi
