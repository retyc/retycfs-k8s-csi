# The published chart in the test VMs (CLUSTER_CHART=prod, the default of .env): released images and the
# production API. `make vm-helm` adds identity.organizationID from RETYC_ORGANIZATION_ID; the
# cluster-wide machine account then waits for an approval in Retyc (doc/testing.md). Needs a published
# chart with machine accounts: until then, CLUSTER_CHART=dev.

# The retyc CLI exports its traces over OTLP as soon as an endpoint is set: to the Jaeger the
# Vagrantfile provisions (UI on http://localhost:18081).
controller:
  extraEnv:
    - name: OTEL_EXPORTER_OTLP_ENDPOINT
      value: 'http://jaeger.jaeger.svc.cluster.local:4318'
    - name: OTEL_SERVICE_NAME
      value: 'retycfs-csi-controller'

mount:
  extraEnv:
    - name: OTEL_EXPORTER_OTLP_ENDPOINT
      value: 'http://jaeger.jaeger.svc.cluster.local:4318'
    - name: OTEL_SERVICE_NAME
      value: 'retycfs-mount'
