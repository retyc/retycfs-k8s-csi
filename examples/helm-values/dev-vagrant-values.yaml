# This repo's chart in the test VMs (CLUSTER_CHART=dev, set in .env.local): the driver image of
# `make image-dev vm-load`, the development API and CLI. `make vm-helm` adds identity.organizationID.
image:
  tag: dev
  pullPolicy: IfNotPresent

# The dev API (https://api.triplesfer.traefik.me) resolves to 127.0.0.1: the pods reach it through
# the host (192.168.121.1), and accept its certificate with RETYC_INSECURE (a dev build only).
# The retyc CLI exports its traces over OTLP as soon as an endpoint is set: to the Jaeger the
# Vagrantfile provisions (UI on http://localhost:18081).
controller:
  extraEnv:
    - name: RETYC_API_BASE_URL
      value: 'https://api.triplesfer.traefik.me'
    - name: RETYC_INSECURE
      value: 'true'
    - name: OTEL_EXPORTER_OTLP_ENDPOINT
      value: 'http://jaeger.jaeger.svc.cluster.local:4318'
    - name: OTEL_SERVICE_NAME
      value: 'retycfs-csi-controller'
  hostAliases:
    - ip: '192.168.121.1'
      hostnames: ['api.triplesfer.traefik.me', 'auth.triplesfer.traefik.me']

# Enrolls the machine accounts against the dev API, like the controller.
enroller:
  extraEnv:
    - name: RETYC_API_BASE_URL
      value: 'https://api.triplesfer.traefik.me'
    - name: RETYC_INSECURE
      value: 'true'
    - name: OTEL_EXPORTER_OTLP_ENDPOINT
      value: 'http://jaeger.jaeger.svc.cluster.local:4318'
    - name: OTEL_SERVICE_NAME
      value: 'retycfs-csi-enroller'
  hostAliases:
    - ip: '192.168.121.1'
      hostnames: ['api.triplesfer.traefik.me', 'auth.triplesfer.traefik.me']

# The development CLI with machine enrollment (no `prod` tag), a local build imported into the VMs
# (not published): `make image-dev CLI_DEV_TAG=machine-enroll CLI_PULL=0` embeds the same in the
# controller and the enroller.
mount:
  image:
    repository: ghcr.io/retyc/retyc-cli-dev
    tag: machine-enroll
    pullPolicy: IfNotPresent
  extraEnv:
    - name: RETYC_API_BASE_URL
      value: 'https://api.triplesfer.traefik.me'
    - name: RETYC_INSECURE
      value: 'true'
    - name: OTEL_EXPORTER_OTLP_ENDPOINT
      value: 'http://jaeger.jaeger.svc.cluster.local:4318'
    - name: OTEL_SERVICE_NAME
      value: 'retycfs-mount'
  hostAliases:
    - ip: '192.168.121.1'
      hostnames: ['api.triplesfer.traefik.me', 'auth.triplesfer.traefik.me']
