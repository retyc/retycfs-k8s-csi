# The published chart in the test VMs (CLUSTER_CHART=prod, the default of vm/.env): released images and the
# production API. `make vm-helm` adds identity.organizationID from RETYC_ORGANIZATION_ID; the
# cluster-wide machine account then waits for an approval in Retyc (doc/testing.md). Needs a published
# chart with machine accounts: until then, CLUSTER_CHART=dev.

# The retyc CLI exports its traces over OTLP as soon as an endpoint is set: to the Jaeger the
# test VM provisions (vm/cloud-init-server.yaml, UI on http://192.168.57.10:8081).
controller:
  extraEnv:
    - name: OTEL_EXPORTER_OTLP_ENDPOINT
      value: 'http://jaeger.jaeger.svc.cluster.local:4318'
    - name: OTEL_SERVICE_NAME
      value: 'retycfs-csi-controller'

mount:
  extraEnv:
    - name: OTEL_EXPORTER_OTLP_ENDPOINT
      value: 'http://jaeger.jaeger.svc.cluster.local:4318'
    - name: OTEL_SERVICE_NAME
      value: 'retycfs-mount'

# The chart's PodMonitors, and the Redis subchart's exporter sidecar with its ServiceMonitor (in
# multi mode, with examples/helm-values/redis-values.yaml), scraped by the Prometheus the test VM
# provisions (vm/cloud-init-server.yaml, UI on http://192.168.57.10:8082).
metrics:
  podMonitor:
    enabled: true

redis:
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      # The subchart's default is 30s; Prometheus scrapes everything else every 15s.
      interval: 15s
