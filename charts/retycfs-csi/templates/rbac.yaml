{{- if .Values.rbac.create }}
# Standard external-provisioner permissions, plus the driver's own `get` on the claims it provisions
# (their annotations), already covered by the persistentvolumeclaims rule. The node plugin's are at
# the end.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "retycfs-csi.fullname" . }}-provisioner
  labels:
    {{- include "retycfs-csi.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "update"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["list", "watch", "create", "update", "patch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["csinodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "retycfs-csi.fullname" . }}-provisioner
  labels:
    {{- include "retycfs-csi.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "retycfs-csi.controller.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ include "retycfs-csi.fullname" . }}-provisioner
  apiGroup: rbac.authorization.k8s.io
---
# Standard external-resizer permissions (expansion and VolumeAttributesClass changes).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "retycfs-csi.fullname" . }}-resizer
  labels:
    {{- include "retycfs-csi.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims/status"]
    verbs: ["patch"]
  # --handle-volume-inuse-error (on by default) watches the pods using a claim.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["list", "watch", "create", "update", "patch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["volumeattributesclasses"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "retycfs-csi.fullname" . }}-resizer
  labels:
    {{- include "retycfs-csi.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "retycfs-csi.controller.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ include "retycfs-csi.fullname" . }}-resizer
  apiGroup: rbac.authorization.k8s.io
{{- if eq (include "retycfs-csi.usesTenantSecrets" .) "true" }}
---
# Tenant StorageClasses: csi-provisioner and csi-resizer read the tenants' identities, Secrets of
# the driver's namespace only (never the tenants' namespaces).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "retycfs-csi.fullname" . }}-controller-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "retycfs-csi.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "retycfs-csi.fullname" . }}-controller-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "retycfs-csi.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "retycfs-csi.controller.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "retycfs-csi.fullname" . }}-controller-secrets
  apiGroup: rbac.authorization.k8s.io
{{- end }}
---
# The controller plugin itself: the namespace of a claim, against the one a tenant identity was
# enrolled for (its UID), and events on the claims.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "retycfs-csi.fullname" . }}-controller
  labels:
    {{- include "retycfs-csi.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "retycfs-csi.fullname" . }}-controller
  labels:
    {{- include "retycfs-csi.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "retycfs-csi.controller.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ include "retycfs-csi.fullname" . }}-controller
  apiGroup: rbac.authorization.k8s.io
{{- if eq (include "retycfs-csi.leaderElection" .) "true" }}
---
# Leader election of csi-provisioner and csi-resizer (more than one controller replica): their
# leases live in the driver's namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "retycfs-csi.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "retycfs-csi.labels" . | nindent 4 }}
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "watch", "list", "delete", "update", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "retycfs-csi.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "retycfs-csi.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "retycfs-csi.controller.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "retycfs-csi.fullname" . }}-leader-election
  apiGroup: rbac.authorization.k8s.io
{{- end }}
---
# Node plugin: reads the claims it stages (their annotations) and records events on them. Before
# mounting a volume with the driver's own identity (no node-stage secrets), it reads its PV (by name
# from the claim, else by listing them for the volume handle) and the PV's StorageClass: a tenant
# class is refused. It checks a tenant identity against the claim's namespace (its UID).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "retycfs-csi.fullname" . }}-node
  labels:
    {{- include "retycfs-csi.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["get", "list"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "retycfs-csi.fullname" . }}-node
  labels:
    {{- include "retycfs-csi.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "retycfs-csi.node.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ include "retycfs-csi.fullname" . }}-node
  apiGroup: rbac.authorization.k8s.io
---
# Node plugin, in the driver's namespace only: the mount pods and their Secrets (Opaque copies of
# the identities they mount with, retycfs-mount-*). kubelet, not the plugin, reads the node-stage
# secrets.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "retycfs-csi.fullname" . }}-node
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "retycfs-csi.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "watch", "delete", "patch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "get", "list", "delete", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "retycfs-csi.fullname" . }}-node
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "retycfs-csi.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "retycfs-csi.node.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "retycfs-csi.fullname" . }}-node
  apiGroup: rbac.authorization.k8s.io
---
# Enroller: watches every RetycIdentity and writes its status and finalizer, creates the
# cluster-wide one (identity.organizationID), reads the namespaces (their UIDs, kube-system's as
# the cluster's) and the PVs (which still use an identity's Secret).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "retycfs-csi.fullname" . }}-enroller
  labels:
    {{- include "retycfs-csi.labels" . | nindent 4 }}
rules:
  - apiGroups: ["csi.retycfs.com"]
    resources: ["retycidentities"]
    verbs: ["get", "list", "watch", "create", "update"]
  - apiGroups: ["csi.retycfs.com"]
    resources: ["retycidentities/status"]
    verbs: ["update"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["list"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "retycfs-csi.fullname" . }}-enroller
  labels:
    {{- include "retycfs-csi.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "retycfs-csi.enroller.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ include "retycfs-csi.fullname" . }}-enroller
  apiGroup: rbac.authorization.k8s.io
---
# Enroller, in the driver's namespace only: the identities' Secrets (the admission policy keeps it
# to those).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "retycfs-csi.fullname" . }}-enroller
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "retycfs-csi.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "create", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "retycfs-csi.fullname" . }}-enroller
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "retycfs-csi.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "retycfs-csi.enroller.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "retycfs-csi.fullname" . }}-enroller
  apiGroup: rbac.authorization.k8s.io
---
# Aggregated to the built-in edit and admin roles: a namespace's editors ask for its identity
# (a RetycIdentity), never read its keys (a Secret of the driver's namespace) nor write its status.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "retycfs-csi.fullname" . }}-identity-edit
  labels:
    {{- include "retycfs-csi.labels" . | nindent 4 }}
    rbac.authorization.k8s.io/aggregate-to-edit: "true"
    rbac.authorization.k8s.io/aggregate-to-admin: "true"
rules:
  - apiGroups: ["csi.retycfs.com"]
    resources: ["retycidentities"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "retycfs-csi.fullname" . }}-identity-view
  labels:
    {{- include "retycfs-csi.labels" . | nindent 4 }}
    rbac.authorization.k8s.io/aggregate-to-view: "true"
rules:
  - apiGroups: ["csi.retycfs.com"]
    resources: ["retycidentities"]
    verbs: ["get", "list", "watch"]
{{- end }}
