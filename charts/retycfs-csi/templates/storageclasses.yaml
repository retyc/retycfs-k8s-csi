{{- /* A class without `tenant` needs the cluster-wide identity: skipped without one (NOTES). */ -}}
{{- include "retycfs-csi.validate" . }}
{{- $classes := include "retycfs-csi.storageClassNames" . | fromJsonArray }}
{{- $secret := printf "%s-${pvc.namespace}" (include "retycfs-csi.identitySecretName" .) }}
{{- range .Values.storageClasses }}
{{- if has .name $classes }}
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: {{ .name }}
  labels:
    {{- include "retycfs-csi.labels" $ | nindent 4 }}
  annotations:
    {{- if .isDefault }}
    storageclass.kubernetes.io/is-default-class: "true"
    {{- end }}
    {{- with .annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
provisioner: {{ include "retycfs-csi.driverName" $ }}
reclaimPolicy: {{ .reclaimPolicy | default "Delete" }}
allowVolumeExpansion: true
volumeBindingMode: {{ .volumeBindingMode | default "Immediate" }}
{{- if .tenant }}
# The claim namespace's identity, enrolled from its RetycIdentity: a Secret of the driver's
# namespace, which tenants cannot read.
parameters:
  csi.storage.k8s.io/provisioner-secret-name: {{ $secret | quote }}
  csi.storage.k8s.io/provisioner-secret-namespace: {{ $.Release.Namespace }}
  csi.storage.k8s.io/node-stage-secret-name: {{ $secret | quote }}
  csi.storage.k8s.io/node-stage-secret-namespace: {{ $.Release.Namespace }}
  # csi-resizer: ControllerExpandVolume, and ControllerModifyVolume which reuses this secret.
  csi.storage.k8s.io/controller-expand-secret-name: {{ $secret | quote }}
  csi.storage.k8s.io/controller-expand-secret-namespace: {{ $.Release.Namespace }}
{{- end }}
{{- end }}
{{- end }}
