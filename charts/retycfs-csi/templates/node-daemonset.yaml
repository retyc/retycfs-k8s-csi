# Privileged: the node plugin runs bind mounts that must become visible to kubelet
# (mountPropagation: Bidirectional), like every filesystem CSI node plugin. It runs no retyc
# process: it starts a mount pod per staged volume (configured by the mount-config ConfigMap).
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "retycfs-csi.fullname" . }}-node
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "retycfs-csi.labels" . | nindent 4 }}
    app.kubernetes.io/component: node
spec:
  selector:
    matchLabels:
      {{- include "retycfs-csi.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: node
  updateStrategy:
    {{- toYaml .Values.node.updateStrategy | nindent 4 }}
  template:
    metadata:
      labels:
        {{- include "retycfs-csi.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: node
        {{- with .Values.node.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/mount-config: {{ include (print $.Template.BasePath "/mount-config.yaml") . | sha256sum }}
        {{- if include "retycfs-csi.redisURLSecret" . }}
        checksum/redis: {{ include (print $.Template.BasePath "/redis-secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.node.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "retycfs-csi.node.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.node.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      containers:
        - name: node-driver-registrar
          image: "{{ .Values.node.registrar.image.repository }}:{{ .Values.node.registrar.image.tag }}"
          imagePullPolicy: {{ .Values.node.registrar.image.pullPolicy }}
          args:
            - --csi-address=/csi/csi.sock
            - --kubelet-registration-path={{ .Values.node.kubeletDir }}/plugins/{{ include "retycfs-csi.driverName" . }}/csi.sock
          resources:
            {{- toYaml .Values.node.registrar.resources | nindent 12 }}
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
            - name: registration-dir
              mountPath: /registration
        - name: retycfs-csi-node
          image: {{ include "retycfs-csi.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --mode=node
            - --endpoint=unix:///csi/csi.sock
            - --http-endpoint=:{{ .Values.healthPort }}
            - --mount-config=/etc/retycfs-csi/mount.json
            - -v={{ .Values.logLevel }}
            {{- include "retycfs-csi.identityArgs" . | nindent 12 }}
            {{- range .Values.node.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          ports:
            - name: health
              containerPort: {{ .Values.healthPort }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            {{- toYaml .Values.probes.liveness | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            {{- toYaml .Values.probes.readiness | nindent 12 }}
          resources:
            {{- toYaml .Values.node.resources | nindent 12 }}
          env:
            - name: NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            # The mount pods and their Secrets live in the driver's namespace.
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- with include "retycfs-csi.redisURLSecret" . }}
            # Preferred over mount.json's, and copied into each mount pod's own Secret.
            - name: RETYC_CACHE_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ dir . }}
                  key: {{ base . }}
            {{- end }}
            {{- with .Values.node.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          securityContext:
            privileged: true
            capabilities:
              add: ["SYS_ADMIN"]
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
            - name: pods-mount-dir
              mountPath: {{ .Values.node.kubeletDir }}/pods
              mountPropagation: Bidirectional
            # Holds kubelet's staging paths, <kubeletDir>/plugins/kubernetes.io/csi/<driver>/<sha>/globalmount.
            # Each mount pod receives only the <sha> directory of its own volume (Bidirectional) and
            # mounts RetycFS on globalmount; Bidirectional here makes that mount visible
            # to the node plugin, which bind-mounts it on the target paths and unmounts a dead one.
            # Checked on a node: kubelet's GetMountRefs on the staging path then sees only the RetycFS
            # mount itself, no extra reference. A second, nested mount of a directory under it would
            # only show every mount twice.
            - name: plugin-dir
              mountPath: {{ .Values.node.kubeletDir }}/plugins
              mountPropagation: Bidirectional
            # Emptied before every mount pod creation.
            - name: spool-dir
              mountPath: {{ .Values.mount.spoolDir }}
            - name: mount-config
              mountPath: /etc/retycfs-csi
              readOnly: true
            # Copied into the mount Secret of a volume staged without node-stage secrets.
            {{- include "retycfs-csi.identityVolumeMount" . | nindent 12 }}
            {{- with .Values.node.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: socket-dir
          hostPath:
            path: {{ .Values.node.kubeletDir }}/plugins/{{ include "retycfs-csi.driverName" . }}
            type: DirectoryOrCreate
        - name: registration-dir
          hostPath:
            path: {{ .Values.node.kubeletDir }}/plugins_registry
            type: Directory
        - name: pods-mount-dir
          hostPath:
            path: {{ .Values.node.kubeletDir }}/pods
            type: Directory
        - name: plugin-dir
          hostPath:
            path: {{ .Values.node.kubeletDir }}/plugins
            type: Directory
        - name: spool-dir
          hostPath:
            path: {{ .Values.mount.spoolDir }}
            type: DirectoryOrCreate
        - name: mount-config
          configMap:
            name: {{ include "retycfs-csi.fullname" . }}-mount-config
        {{- include "retycfs-csi.identityVolume" . | nindent 8 }}
        {{- with .Values.node.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.node.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.node.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.node.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
