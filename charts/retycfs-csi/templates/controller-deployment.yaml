apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "retycfs-csi.fullname" . }}-controller
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "retycfs-csi.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
spec:
  replicas: {{ .Values.controller.replicas }}
  selector:
    matchLabels:
      {{- include "retycfs-csi.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: controller
  template:
    metadata:
      labels:
        {{- include "retycfs-csi.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: controller
        {{- with .Values.controller.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.controller.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "retycfs-csi.controller.serviceAccountName" . }}
      # The controller finishes adding the initial members of a dataroom it just created (at most
      # 5 minutes) before it exits; it exits at once when there are none.
      terminationGracePeriodSeconds: 330
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controller.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.controller.hostAliases }}
      hostAliases:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: csi-provisioner
          image: "{{ .Values.controller.provisioner.image.repository }}:{{ .Values.controller.provisioner.image.tag }}"
          imagePullPolicy: {{ .Values.controller.provisioner.image.pullPolicy }}
          args:
            - --csi-address=/csi/csi.sock
            - --extra-create-metadata
            # CreateVolume runs several CLI calls; csi-provisioner's own default is 10s.
            - --timeout=60s
            {{- if and (eq (include "retycfs-csi.leaderElection" .) "true") (not (has "--leader-election" .Values.controller.provisioner.extraArgs)) }}
            - --leader-election
            {{- end }}
            {{- range .Values.controller.provisioner.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.controller.provisioner.resources | nindent 12 }}
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
        - name: csi-resizer
          image: "{{ .Values.controller.resizer.image.repository }}:{{ .Values.controller.resizer.image.tag }}"
          imagePullPolicy: {{ .Values.controller.resizer.image.pullPolicy }}
          args:
            - --csi-address=/csi/csi.sock
            # Each call runs `retyc dataroom set` (token refresh, API round-trips): 10 s by default is short.
            - --resize-timeout=60s
            - --modify-timeout=60s
            {{- if and (eq (include "retycfs-csi.leaderElection" .) "true") (not (has "--leader-election" .Values.controller.resizer.extraArgs)) }}
            - --leader-election
            {{- end }}
            {{- range .Values.controller.resizer.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.controller.resizer.resources | nindent 12 }}
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
        - name: retycfs-csi-controller
          image: {{ include "retycfs-csi.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --mode=controller
            - --endpoint=unix:///csi/csi.sock
            - --http-endpoint=:{{ .Values.healthPort }}
            - -v={{ .Values.logLevel }}
            {{- include "retycfs-csi.identityArgs" . | nindent 12 }}
            {{- range .Values.controller.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          ports:
            - name: health
              containerPort: {{ .Values.healthPort }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            {{- toYaml .Values.probes.liveness | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            {{- toYaml .Values.probes.readiness | nindent 12 }}
          resources:
            {{- toYaml .Values.controller.resources | nindent 12 }}
          {{- with .Values.controller.extraEnv }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
            {{- include "retycfs-csi.identityVolumeMount" . | nindent 12 }}
            # Each retyc call gets the identity's keys in a 0700 directory here: memory, never disk.
            - name: tmp
              mountPath: /tmp
            {{- with .Values.controller.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: socket-dir
          emptyDir: {}
        {{- include "retycfs-csi.identityVolume" . | nindent 8 }}
        - name: tmp
          # tmpfs: counts toward the memory of the container writing it.
          emptyDir:
            medium: Memory
        {{- with .Values.controller.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.controller.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controller.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controller.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controller.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
