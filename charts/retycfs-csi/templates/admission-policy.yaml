{{- /*
Checks the csi.retycfs.com/* annotations of the claims on this release's StorageClasses, with the
formats the driver accepts (internal/driver/annotations.go), so that a mistake fails `kubectl apply`
instead of CreateVolume or the stage. Only what changes is checked on an update: a claim admitted
before the policy (or a controller updating it) is never blocked by an annotation it already had.

Not covered (documented in values.yaml): a claim that receives one of these classes later as the
cluster default (retroactive assignment), and the claim of a static PV on another class.
*/ -}}
{{- $classes := include "retycfs-csi.storageClassNames" . | fromJsonArray }}
{{- if and .Values.admissionPolicy.enabled $classes }}
{{- $name := printf "%s-pvc-annotations" (include "retycfs-csi.fullname" .) }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $name }}
  labels:
    {{- include "retycfs-csi.labels" . | nindent 4 }}
spec:
  failurePolicy: {{ .Values.admissionPolicy.failurePolicy | default "Fail" }}
  matchConstraints:
    resourceRules:
      # The main resource only: status updates (persistentvolumeclaims/status) are not matched.
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["persistentvolumeclaims"]
  matchConditions:
    # Mutating admission (DefaultStorageClass) has already filled in a default class at creation.
    - name: retycfs-storage-class
      expression: >-
        has(object.spec.storageClassName) && object.spec.storageClassName in {{ $classes | toJson }}
  variables:
    - name: ann
      expression: "has(object.metadata.annotations) ? object.metadata.annotations : {}"
    - name: old
      expression: "request.operation == 'UPDATE' && has(oldObject.metadata.annotations) ? oldObject.metadata.annotations : {}"
    # The csi.retycfs.com/* annotations added or modified by this request.
    - name: changed
      expression: >-
        variables.ann.filter(k, k.startsWith('csi.retycfs.com/')
        && (!(k in variables.old) || variables.old[k] != variables.ann[k]))
  validations:
    - expression: "request.operation != 'CREATE' || 'csi.retycfs.com/uid' in variables.ann"
      message: >-
        annotation csi.retycfs.com/uid is required on a Retyc claim: the UID that owns every file of
        the volume, the one its pods must run as to write (an integer, "0" for root)
      reason: Invalid
    - expression: "!('csi.retycfs.com/uid' in variables.old) || 'csi.retycfs.com/uid' in variables.ann"
      message: >-
        annotation csi.retycfs.com/uid cannot be removed from a Retyc claim (change its value instead:
        it applies at the next mount of the volume on each node)
      reason: Invalid
    {{- range list "uid" "gid" }}
    {{- $k := printf "csi.retycfs.com/%s" . }}
    - expression: >-
        !('{{ $k }}' in variables.changed)
        || (variables.ann['{{ $k }}'].matches('^0*[0-9]{1,10}$') && int(variables.ann['{{ $k }}']) <= 4294967295)
      messageExpression: >-
        'annotation {{ $k }} = "' + variables.ann['{{ $k }}'] + '": want an integer between 0 and 4294967295'
      message: "annotation {{ $k }}: want an integer between 0 and 4294967295"
      reason: Invalid
    {{- end }}
    # time.ParseDuration's syntax (the regex keeps duration() from failing), and not negative.
    - expression: >-
        !('csi.retycfs.com/cache-ttl' in variables.changed)
        || (variables.ann['csi.retycfs.com/cache-ttl'].matches(r'^[-+]?(0|(([0-9]+(\.[0-9]*)?|\.[0-9]+)(ns|us|µs|μs|ms|s|m|h))+)$')
            && duration(variables.ann['csi.retycfs.com/cache-ttl']) >= duration('0s'))
      messageExpression: >-
        'annotation csi.retycfs.com/cache-ttl = "' + variables.ann['csi.retycfs.com/cache-ttl'] + '": want a positive Go duration (30s, 5m, 1h30m)'
      message: "annotation csi.retycfs.com/cache-ttl: want a positive Go duration (30s, 5m, 1h30m)"
      reason: Invalid
    # strconv.ParseBool's values.
    {{- range list "background-delete" "unsafe-write" "read-only" "warmup" }}
    {{- $k := printf "csi.retycfs.com/%s" . }}
    - expression: >-
        !('{{ $k }}' in variables.changed)
        || variables.ann['{{ $k }}'] in ['true', 'false', 'True', 'False', 'TRUE', 'FALSE', 't', 'f', 'T', 'F', '1', '0']
      messageExpression: >-
        'annotation {{ $k }} = "' + variables.ann['{{ $k }}'] + '": want true or false'
      message: "annotation {{ $k }}: want true or false"
      reason: Invalid
    {{- end }}
    # strconv.ParseUint(_, 10, 31): 0 (every level) or a number of levels.
    - expression: >-
        !('csi.retycfs.com/warmup-depth' in variables.changed)
        || (variables.ann['csi.retycfs.com/warmup-depth'].matches('^0*[0-9]{1,10}$')
            && int(variables.ann['csi.retycfs.com/warmup-depth']) <= 2147483647)
      messageExpression: >-
        'annotation csi.retycfs.com/warmup-depth = "' + variables.ann['csi.retycfs.com/warmup-depth'] + '": want a positive integer (0: every level)'
      message: "annotation csi.retycfs.com/warmup-depth: want a positive integer (0: every level)"
      reason: Invalid
    # Patterns separated by spaces, or "none" alone (keep no file local).
    - expression: >-
        !('csi.retycfs.com/local-file' in variables.changed)
        || !variables.ann['csi.retycfs.com/local-file'].matches(r'(^|\s)none(\s|$)')
        || variables.ann['csi.retycfs.com/local-file'].matches(r'^\s*none\s*$')
      messageExpression: >-
        'annotation csi.retycfs.com/local-file = "' + variables.ann['csi.retycfs.com/local-file'] + '": "none" cannot be combined with patterns'
      message: 'annotation csi.retycfs.com/local-file: "none" cannot be combined with patterns'
      reason: Invalid
    # resource.ParseQuantity, and strictly positive.
    {{- range list "mount-cpu-request" "mount-cpu-limit" "mount-memory-request" "mount-memory-limit" }}
    {{- $k := printf "csi.retycfs.com/%s" . }}
    - expression: >-
        !('{{ $k }}' in variables.changed)
        || (isQuantity(variables.ann['{{ $k }}']) && quantity(variables.ann['{{ $k }}']).isGreaterThan(quantity('0')))
      messageExpression: >-
        'annotation {{ $k }} = "' + variables.ann['{{ $k }}'] + '": want a positive Kubernetes quantity (100m, 512Mi)'
      message: "annotation {{ $k }}: want a positive Kubernetes quantity (100m, 512Mi)"
      reason: Invalid
    {{- end }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ $name }}
  labels:
    {{- include "retycfs-csi.labels" . | nindent 4 }}
spec:
  policyName: {{ $name }}
  validationActions: [Deny]
{{- end }}
