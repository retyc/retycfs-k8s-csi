apiVersion: v2
name: retycfs-csi
description: Kubernetes CSI driver for Retyc datarooms - ReadWriteMany volumes with end-to-end post-quantum encryption
type: application
version: 0.6.0
appVersion: "v0.6.0"
kubeVersion: ">=1.34.0-0"
home: https://retyc.com
sources:
  - https://github.com/retyc/retycfs-k8s-csi
keywords:
  - csi
  - storage
  - retyc
  - retycfs
  - dataroom
  - readwritemany
  - encryption
maintainers:
  - name: Retyc
    url: https://retyc.com
annotations:
  artifacthub.io/license: MIT
  artifacthub.io/category: storage
dependencies:
  # Shared listing cache of the mount pods (cache.store: redis), off by default. CloudPirates
  # publishes its charts on Docker Hub's OCI registry only (no classic index to `helm repo add`).
  - name: redis
    version: 0.37.2
    repository: oci://registry-1.docker.io/cloudpirates
    condition: cache.redis.subchart.enabled
