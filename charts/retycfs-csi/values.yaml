# Default values for retycfs-csi.

image:
  # Docker Hub mirror: retyc/retycfs-k8s-csi (same digest).
  repository: ghcr.io/retyc/retycfs-k8s-csi
  # -- Overrides the image tag; defaults to the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent

# -- Pull secrets for the driver image, applied to both the controller and the node plugin (the
# sidecar images are public). Only needed for a private mirror of the image.
imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

# Retyc identities: machine accounts the enroller requests from Retyc, each approved by an
# organization administrator (Organization > Machines) after comparing its fingerprint. Their keys
# stay in Secrets of the release namespace, which only the enroller writes.
identity:
  # -- UUID of the Retyc organization of the cluster-wide identity. Set, the enroller creates the
  # RetycIdentity `default` of the release namespace (Secret `retycfs-identity`), the StorageClasses
  # without `tenant` are rendered; their claims wait until the machine is approved (the pods do not).
  # Also the organization of the tenants' RetycIdentities without `spec.organizationID`. Empty:
  # tenant identities only. Changing it later does not move an existing identity (organizationID is
  # immutable): delete the RetycIdentity `default` of the release namespace to enroll in the new one.
  organizationID: ""
  # -- Prefix of the machines' default display name in Retyc, `<clusterName>/<namespace>`.
  clusterName: kubernetes

storageClasses:
  # Each entry becomes a StorageClass provisioned by this driver, with allowVolumeExpansion.
  # `tenant: true` switches the class to per-namespace identities: the provisioner, the resizer and
  # kubelet use the Secret `retycfs-identity-<claim namespace>` of the release namespace, the
  # enrolled identity of a RetycIdentity in the claim's namespace, instead of the cluster-wide one.
  # A class without it is only rendered with a cluster-wide identity (`identity.organizationID`).
  - name: retycfs-rwx
    reclaimPolicy: Delete
    volumeBindingMode: Immediate
    isDefault: false
    annotations: {}
    tenant: false
  - name: retycfs-rwx-retain
    reclaimPolicy: Retain
    volumeBindingMode: Immediate
    isDefault: false
    annotations: {}
    tenant: false
  - name: retycfs-rwx-tenant
    # Retain on purpose: a tenant deleting its RetycIdentity before its claims would otherwise
    # leave PVs stuck on a DeleteVolume that can no longer authenticate.
    reclaimPolicy: Retain
    volumeBindingMode: Immediate
    isDefault: false
    annotations: {}
    tenant: true

rbac:
  # -- Create the RBAC of the controller, the node plugin and the enroller, and the aggregated
  # ClusterRoles on RetycIdentities (`<fullname>-identity-edit` to the edit and admin roles,
  # `<fullname>-identity-view` to view).
  create: true

serviceAccount:
  controller:
    create: true
    # -- Defaults to `<fullname>-controller`.
    name: ""
    annotations: {}
  node:
    create: true
    # -- Defaults to `<fullname>-node`.
    name: ""
    annotations: {}
  enroller:
    create: true
    # -- Defaults to `<fullname>-enroller`. The machine identity admission policy only lets this
    # service account write the identities' Secrets.
    name: ""
    annotations: {}

# -- Extra Kubernetes objects to deploy with the release, each one rendered as a template (so
# `{{ .Release.Namespace }}` and `{{ include "retycfs-csi.fullname" . }}` work). Use it for anything
# your cluster requires around the driver without patching the chart: a NetworkPolicy on a
# default-deny cluster, a CiliumNetworkPolicy, a Secret from an external-secrets operator...
#
# The traffic of the release: HTTPS to api.retyc.com and auth.retyc.com from the controller and the
# mount pods, the Kubernetes API from the controller (sidecars) and the node plugin, the node
# plugin to the mount pods (port 9567, /readyz), the mount pods to Redis (cache.store: redis) and
# DNS. Example, with the Retyc endpoints as CIDRs since a plain NetworkPolicy has no notion of
# hostname: the first policy opens the subchart's Redis to the mount pods only, the second limits
# the mount pods' egress to DNS, Redis and the Retyc API. The mount pods carry
# app.kubernetes.io/name=retycfs-mount, the subchart's pods app.kubernetes.io/name=redis.
#
# extraObjects:
#   - apiVersion: networking.k8s.io/v1
#     kind: NetworkPolicy
#     metadata:
#       name: '{{ include "retycfs-csi.fullname" . }}-redis'
#       namespace: '{{ .Release.Namespace }}'
#     spec:
#       podSelector:
#         matchLabels:
#           app.kubernetes.io/name: redis
#           app.kubernetes.io/instance: '{{ .Release.Name }}'
#       policyTypes: [Ingress]
#       ingress:
#         - from:
#             - podSelector:
#                 matchLabels: {app.kubernetes.io/name: retycfs-mount}
#           ports: [{protocol: TCP, port: 6379}]
#   - apiVersion: networking.k8s.io/v1
#     kind: NetworkPolicy
#     metadata:
#       name: '{{ include "retycfs-csi.fullname" . }}-mount-egress'
#       namespace: '{{ .Release.Namespace }}'
#     spec:
#       podSelector:
#         matchLabels: {app.kubernetes.io/name: retycfs-mount}
#       policyTypes: [Egress]
#       egress:
#         - to:                                   # cluster DNS
#             - namespaceSelector: {}
#               podSelector:
#                 matchLabels: {k8s-app: kube-dns}
#           ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
#         - to:                                   # the subchart's Redis
#             - podSelector:
#                 matchLabels:
#                   app.kubernetes.io/name: redis
#                   app.kubernetes.io/instance: '{{ .Release.Name }}'
#           ports: [{protocol: TCP, port: 6379}]
#         - to: [{ipBlock: {cidr: 203.0.113.0/24}}] # api.retyc.com / auth.retyc.com
#           ports: [{protocol: TCP, port: 443}]
extraObjects: []

# -- Port of the driver's /healthz, /readyz and /metrics endpoints, in both components.
healthPort: 9808

metrics:
  # Both components serve Prometheus metrics on `healthPort` (container port `health`), always, and
  # every mount pod on port 9567 (container port `metrics`: the CLI's RetycFS, cache and Go metrics).
  # See doc/configuration.md.
  podMonitor:
    # -- Create two Prometheus Operator PodMonitors, one for both driver components and one for the
    # mount pods (needs the monitoring.coreos.com CRDs). The settings below apply to both.
    enabled: false
    # -- Namespace of the PodMonitor; defaults to the release namespace.
    namespace: ""
    # -- Extra labels, e.g. the ones your Prometheus' podMonitorSelector matches.
    labels: {}
    # -- Scrape interval; empty uses Prometheus' default.
    interval: ""
    # -- Scrape timeout; empty uses Prometheus' default.
    scrapeTimeout: ""
    # -- Relabelings applied to the scraped targets.
    relabelings: []
    # -- Relabelings applied to the scraped series, e.g. to drop the driver's `go_*` families.
    metricRelabelings: []

# -- klog verbosity of the driver containers.
logLevel: 2

probes:
  # Liveness only checks that the driver still serves HTTP. Restarting the node plugin cuts no
  # mount (the mount pods hold them), but stages, publishes and the repair of dead mount pods wait
  # for it on that node, so it stays lenient. Readiness: the driver serves (the identities show on
  # their RetycIdentity, so that `helm install --wait` does not wait for an approval).
  liveness:
    initialDelaySeconds: 10
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 5
  readiness:
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 2

controller:
  # -- Number of controller pods. Above 1, `--leader-election` is added to csi-provisioner and
  # csi-resizer (with a Role on leases): one replica works, the others wait. Spread them with
  # `affinity` or `topologySpreadConstraints`, e.g.:
  #   affinity:
  #     podAntiAffinity:
  #       preferredDuringSchedulingIgnoredDuringExecution:
  #         - weight: 100
  #           podAffinityTerm:
  #             topologyKey: kubernetes.io/hostname
  #             labelSelector:
  #               matchLabels:
  #                 app.kubernetes.io/name: retycfs-csi
  #                 app.kubernetes.io/component: controller
  #   topologySpreadConstraints:
  #     - maxSkew: 1
  #       topologyKey: topology.kubernetes.io/zone
  #       whenUnsatisfiable: ScheduleAnyway
  #       labelSelector:
  #         matchLabels:
  #           app.kubernetes.io/name: retycfs-csi
  #           app.kubernetes.io/component: controller
  replicas: 1
  # -- Extra /etc/hosts entries of the controller pods.
  hostAliases: []
  # -- Extra arguments for the driver container.
  extraArgs: []
  # -- Extra environment variables for the driver container, e.g. an egress proxy:
  #   extraEnv:
  #     - {name: HTTPS_PROXY, value: http://proxy.internal:3128}
  #     - {name: NO_PROXY, value: 127.0.0.1,localhost,10.0.0.0/8}
  extraEnv: []
  # -- Extra volumes and mounts for the driver container, e.g. a private CA bundle for a TLS
  # inspection proxy:
  #   extraVolumes:
  #     - {name: ca, configMap: {name: corporate-ca}}
  #   extraVolumeMounts:
  #     - {name: ca, mountPath: /etc/ssl/certs/corporate-ca.crt, subPath: ca.crt, readOnly: true}
  extraVolumes: []
  extraVolumeMounts: []
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 512Mi
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  priorityClassName: system-cluster-critical
  provisioner:
    image:
      repository: registry.k8s.io/sig-storage/csi-provisioner
      tag: v6.3.0
      pullPolicy: IfNotPresent
    # -- Extra arguments for csi-provisioner (`--leader-election` is added by `controller.replicas` > 1).
    extraArgs: []
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi
  # csi-resizer: PVC expansion (ControllerExpandVolume) and VolumeAttributesClass changes
  # (ControllerModifyVolume, Kubernetes 1.34+).
  resizer:
    image:
      repository: registry.k8s.io/sig-storage/csi-resizer
      tag: v2.3.0
      pullPolicy: IfNotPresent
    # -- Extra arguments for csi-resizer (`--leader-election` is added by `controller.replicas` > 1).
    extraArgs: []
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi

node:
  # -- Root of the kubelet state on the nodes.
  kubeletDir: /var/lib/kubelet
  # -- Extra arguments for the driver container.
  extraArgs: []
  # -- Extra environment variables for the driver container, e.g. an egress proxy:
  #   extraEnv:
  #     - {name: HTTPS_PROXY, value: http://proxy.internal:3128}
  #     - {name: NO_PROXY, value: 127.0.0.1,localhost,10.0.0.0/8}
  extraEnv: []
  # -- Extra volumes and mounts for the driver container, e.g. a private CA bundle for a TLS
  # inspection proxy:
  #   extraVolumes:
  #     - {name: ca, configMap: {name: corporate-ca}}
  #   extraVolumeMounts:
  #     - {name: ca, mountPath: /etc/ssl/certs/corporate-ca.crt, subPath: ca.crt, readOnly: true}
  extraVolumes: []
  extraVolumeMounts: []
  # The node plugin runs no retyc process: the mounts live in the mount pods (see `mount`).
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  # -- Run on every node, tainted or not, like other CSI node plugins.
  tolerations:
    - operator: Exists
  affinity: {}
  priorityClassName: system-node-critical
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      # A node plugin restart cuts no mount: the mount pods hold them.
      maxUnavailable: 1
  registrar:
    image:
      repository: registry.k8s.io/sig-storage/csi-node-driver-registrar
      tag: v2.17.0
      pullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        memory: 64Mi

# Enroller: requests the machine accounts of the RetycIdentities (`retyc machine enroll`), keeps
# their keys in Secrets of the release namespace and checks the approved ones. One replica, same
# image as the controller, non-root; the keys only touch its in-memory /tmp.
enroller:
  # -- Extra /etc/hosts entries of the enroller pod.
  hostAliases: []
  # -- Extra arguments for the enroller container.
  extraArgs: []
  # -- Extra environment variables for the enroller container, e.g. an egress proxy.
  extraEnv: []
  extraVolumes: []
  extraVolumeMounts: []
  # Each enrollment runs one retyc process that waits for the approval (15 minutes at most).
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 256Mi
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  priorityClassName: ""

# Mount pods: one per volume and node, in the release namespace, running `retyc fs mount`. Their
# settings apply to the pods created from now on: a running pod keeps its own until its volume is
# remounted on its node.
mount:
  image:
    repository: ghcr.io/retyc/retyc-cli
    tag: v1.5.0
    pullPolicy: IfNotPresent
  # -- Pull secrets of the retyc-cli image, in the release namespace.
  imagePullSecrets: []
  # -- Extra environment variables of the CLI (after the driver's: they can override RETYC_*).
  extraEnv: []
  # -- Extra /etc/hosts entries of the mount pods.
  hostAliases: []
  # -- Share the host PID namespace (not needed so far, kept for diagnosis).
  hostPID: false
  # -- Default resources of a mount pod, overridden per claim by the csi.retycfs.com/mount-cpu-request,
  # -cpu-limit, -memory-request and -memory-limit annotations. The limit leaves room for the FUSE
  # buffers, the in-memory listing cache and the files in transit; raise it per claim for large
  # trees with `cache.store: memory`.
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      memory: 384Mi
  # -- How long a stopping mount pod may take to send its pending writes (`--drain-timeout`).
  drainTimeout: 5m
  # -- Priority class of the mount pods; empty means system-node-critical.
  priorityClassName: ""
  # -- Host directory of the spools (files not sent yet), one subdirectory per volume.
  spoolDir: /var/lib/retycfs-csi/spool

# Listing cache of the mount pods (`retyc fs mount --cache-store`). `memory` (the CLI's default)
# keeps one cache per mount pod. `redis` shares one Redis between every mount pod of the cluster:
# either the bundled subchart (`cache.redis.subchart`, configured under `redis` below) or your
# own (`cache.redis.external`). The Redis URL can hold a password, so it never goes into the
# mount-config ConfigMap: the node plugin reads it from a Secret (RETYC_CACHE_REDIS_URL) and copies
# it into each mount pod's own Secret. Settings apply to the mount pods created from now on.
cache:
  # -- `memory` or `redis`.
  store: memory
  # -- `--cache-redis-high-confidentiality`. False: Redis holds the decrypted file and folder names
  # (about 2.3 MB per 10,000 files), so treat it like the nodes' disks and share it with no other
  # tenant. True: Redis holds the API's ciphertexts only (about 19 MB per 10,000 files, plus one
  # decryption per name on each mount pod). Set it with several tenants on one Redis.
  highConfidentiality: false
  redis:
    subchart:
      # -- Deploy the CloudPirates Redis chart with the release (standalone, no persistence,
      # password, maxmemory with allkeys-lru: see `redis`). Only with `store: redis`: going back
      # to `memory` takes `enabled: false` too, which removes the Redis.
      enabled: false
      # -- Redis password (letters, digits and `-._~` only: it goes into a URL). Empty generates one
      # at install and keeps it across upgrades, with Helm's `lookup`. In GitOps (Argo CD, `helm
      # template`), `lookup` returns nothing: each render would generate a new password while the
      # Redis StatefulSet keeps the former one. There, set `password` or use `existingSecret`.
      password: ""
      # -- A Secret you manage instead of the chart's, in the release namespace, with the keys
      # `redis-password` (the password) and `RETYC_CACHE_REDIS_URL`
      # (`redis://default:<password>@<release>-redis:6379`). Set `redis.auth.existingSecret` to the
      # same name: the subchart reads its password there. `password` is then ignored.
      existingSecret: ""
    external:
      # -- URL of your own Redis, `redis://[user:password@]host:6379[/db]` or `rediss://` for TLS.
      # Standalone only (the CLI supports neither Cluster nor Sentinel), Redis 7.4 or later. The chart
      # stores it in a Secret.
      url: ""
      # -- Existing Secret holding the URL instead, in the release namespace. Takes precedence over `url`.
      existingSecret: ""
      # -- Key of the URL in `existingSecret`.
      existingSecretKey: RETYC_CACHE_REDIS_URL

# ValidatingAdmissionPolicy (admissionregistration.k8s.io/v1) on the claims of the chart's
# StorageClasses: checks the csi.retycfs.com/* annotations at creation and update, and refuses a claim
# without csi.retycfs.com/uid or one that drops it. Only the classes rendered by this release are
# known: a claim that gets one of them later as the cluster default (retroactive default class
# assignment, on a claim created without storageClassName) and a static PV's claim on another
# class are not checked; the driver still refuses them at CreateVolume or at stage.
#
# A second policy guards the identities' Secrets (type csi.retycfs.com/machine-identity) in the
# release namespace: only the enroller's service account creates, updates or deletes them, and it
# writes no other Secret than `retycfs-identity` and `retycfs-identity-*` of that type. Members of
# system:masters are let through (break-glass).
admissionPolicy:
  # -- Create the policies and their bindings.
  enabled: true
  # -- `Fail` or `Ignore`: what the API server does with a request when the policy cannot be
  # evaluated (a CEL error, a missing parameter). The reach is small either way: only the CREATE and
  # UPDATE of the claims of this release's StorageClasses are matched, never other storage. But
  # with `Fail`, a broken policy blocks every CREATE and UPDATE of those claims (a StatefulSet's
  # new claims included); `Ignore` lets them through unchecked, and the driver refuses an invalid
  # claim later (CreateVolume, stage). The Secrets policy always fails closed.
  failurePolicy: Fail

# Values of the Redis subchart (https://github.com/CloudPirates-io/helm-charts/tree/main/charts/redis),
# used when `cache.redis.subchart.enabled`. Only a cache: no persistence, evicts the least recently
# used keys at `maxmemory` (keep it below the memory limit).
redis:
  # The CLI supports neither Redis Cluster nor Sentinel.
  architecture: standalone
  image:
    # Redis 8 (the CLI needs 7.4 or later).
    pullPolicy: IfNotPresent
  auth:
    enabled: true
    # The Secret the chart creates (password and URL); must stay in sync with retycfs-csi's.
    existingSecret: '{{ .Release.Name }}-redis-auth'
    existingSecretPasswordKey: redis-password
  persistence:
    enabled: false
  extraConfig: |
    maxmemory 256mb
    maxmemory-policy allkeys-lru
  resources:
    requests:
      cpu: 50m
      memory: 300Mi
    limits:
      memory: 384Mi
