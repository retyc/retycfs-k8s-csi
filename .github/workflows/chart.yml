name: Chart

# Publishes charts/retycfs-csi whenever its Chart.yaml version changes on master: a GitHub release
# per chart version, the index.yaml of the Helm repository on the gh-pages branch (served at
# https://retyc.github.io/retycfs-k8s-csi), and the same package on the OCI registry.
on:
  push:
    branches: [master]
    paths:
      - 'charts/**'
      - '.github/workflows/chart.yml'
  workflow_dispatch:

jobs:
  release:
    name: Release chart
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write # keyless cosign signing (Sigstore OIDC)

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v4.2.4

      # The Redis subchart (Chart.lock): packaged into the chart's .tgz.
      - name: Dependencies
        run: helm dependency build charts/retycfs-csi

      - name: Lint
        run: helm lint charts/retycfs-csi

      # Packages charts whose version has no release yet, creates the release with the .tgz,
      # and regenerates index.yaml on gh-pages. Chart releases are not marked "latest" so the
      # driver's own v* releases keep that spot.
      - name: chart-releaser
        id: cr
        uses: helm/chart-releaser-action@v1.7.0
        with:
          charts_dir: charts
          mark_as_latest: false
          skip_existing: true
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

      - name: Set up cosign
        if: steps.cr.outputs.changed_charts != ''
        uses: sigstore/cosign-installer@v4.1.2

      - name: Log in to GitHub Container Registry
        if: steps.cr.outputs.changed_charts != ''
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          # cosign reads the Docker credential store, not Helm's.
          echo "${{ secrets.GITHUB_TOKEN }}" | cosign login ghcr.io -u "${{ github.actor }}" --password-stdin

      # Check remote version before bump chart 
      - name: Push to OCI registry
        if: steps.cr.outputs.changed_charts != ''
        run: |
          shopt -s nullglob
          for pkg in .cr-release-packages/*.tgz; do
            meta=$(helm show chart "$pkg")
            # Anchored on ^ so nested "name:"/"version:" keys (maintainers, dependencies) cannot
            # win, and without yq, whose implementations disagree on quoting scalars.
            name=$(echo "$meta" | awk -F': *' '/^name:/ { gsub(/"/, "", $2); print $2; exit }')
            version=$(echo "$meta" | awk -F': *' '/^version:/ { gsub(/"/, "", $2); print $2; exit }')
            if helm show chart "oci://ghcr.io/retyc/charts/$name" --version "$version" >/dev/null 2>&1; then
              echo "oci://ghcr.io/retyc/charts/$name:$version already published, skipping"
              continue
            fi
            out=$(helm push "$pkg" oci://ghcr.io/retyc/charts 2>&1)
            echo "$out"
            digest=$(echo "$out" | awk '/^Digest:/ { print $2; exit }')
            if [ -z "$digest" ]; then
              echo "::error::no digest in helm push output for $name:$version"
              exit 1
            fi
            # Keyless signature (Sigstore, GitHub OIDC identity of this workflow), by digest so the
            # tag cannot be swapped in between. Artifact Hub detects it through the OCI referrers API.
            cosign sign --yes "ghcr.io/retyc/charts/$name@$digest"
          done

      # Artifact Hub reads an OCI repository's metadata (artifacthub-repo.yml) from its
      # "artifacthub.io" tag. Pushed on every run so edits to the file reach the registry.
      - name: Set up ORAS
        uses: oras-project/setup-oras@v1

      - name: Push Artifact Hub metadata
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          cd charts/retycfs-csi
          oras push ghcr.io/retyc/charts/retycfs-csi:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml
