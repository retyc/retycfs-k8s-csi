name: _CI

on:
  workflow_call:

jobs:
  go:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify dependencies
        run: go mod verify

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2

      - name: Test
        run: go test -race -coverprofile=coverage.out ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1

      # Not golang/govulncheck-action: it runs its own actions/setup-go with go-version: stable,
      # which wins over go-version-file. The scan then ran on the newest Go release and reported
      # no standard library vulnerability at all, while its second Go cache flooded the job with
      # tar errors. Running it here makes it inherit the go.mod toolchain set up above.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Build
        run: CGO_ENABLED=0 go build -trimpath ./...

  helm:
    name: Helm chart
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v4.2.4   # "latest" still resolves to the 3.x line

      # The Redis subchart (Chart.lock), pulled from Docker Hub's OCI registry.
      - name: Dependencies
        run: helm dependency build charts/retycfs-csi

      - name: Lint (values schema included)
        run: helm lint charts/retycfs-csi

      # The controller's embedded retyc-cli and the mount pods' image must be the same release.
      - name: retyc-cli version, Dockerfile vs chart
        run: .github/scripts/check-cli-version.sh

      - name: Render in every identity and cache mode
        run: |
          org=0190a7f4-0000-7000-8000-000000000001
          helm template x charts/retycfs-csi -n retycfs-system --set identity.organizationID=$org > /tmp/managed.yaml
          helm template x charts/retycfs-csi -n retycfs-system > /tmp/tenant-only.yaml
          helm template x charts/retycfs-csi --set identity.organizationID=$org --set controller.replicas=3 > /tmp/ha.yaml
          helm template x charts/retycfs-csi --set identity.organizationID=$org \
            --set cache.store=redis --set cache.redis.subchart.enabled=true > /tmp/redis-subchart.yaml
          helm template x charts/retycfs-csi --set identity.organizationID=$org \
            --set cache.store=redis --set cache.redis.external.url=redis://default:p@redis:6379 > /tmp/redis-external.yaml
          # The Redis password never lands in the mount pods' ConfigMap.
          ! helm template x charts/retycfs-csi --set identity.organizationID=$org --set cache.store=redis \
            --set cache.redis.external.url=redis://default:p@redis:6379 \
            --show-only templates/mount-config.yaml | grep -q 'redis://'
          # The driver no longer has --require-identity: an unknown flag would stop it.
          ! grep -q -- --require-identity /tmp/managed.yaml /tmp/tenant-only.yaml
          # The removed token identity fails loudly.
          ! helm template x charts/retycfs-csi --set credentials.existingSecret=s >/dev/null 2>&1

      # Validate the rendered manifests against the Kubernetes API schemas, for the oldest and
      # the newest version the chart claims to support (Chart.yaml kubeVersion). kubeconform has no
      # schema for CustomResourceDefinition: the API server validates the RetycIdentity CRD.
      - name: kubeconform
        run: |
          for v in 1.34.0 1.36.0; do
            for f in /tmp/managed.yaml /tmp/tenant-only.yaml /tmp/ha.yaml /tmp/redis-subchart.yaml; do
              docker run --rm -i ghcr.io/yannh/kubeconform:v0.8.0 \
                -strict -summary -skip CustomResourceDefinition -kubernetes-version "$v" < "$f"
            done
          done

      - name: Package
        run: helm package charts/retycfs-csi -d dist
