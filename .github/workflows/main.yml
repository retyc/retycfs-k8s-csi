name: CI

on:
  push:
    branches: ['**']
    paths: &code_paths
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'Dockerfile'
      - 'charts/**'
      - '.github/scripts/**'
      - '.github/workflows/main.yml'
      - '.github/workflows/_ci.yml'
      - '.github/workflows/_docker.yml'
  pull_request:
    paths: *code_paths
  workflow_dispatch:

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/_ci.yml

  # Builds the full image (driver + embedded retyc-cli) for both platforms everywhere, so
  # a broken Dockerfile fails the PR rather than the release; pushes it (as `master`) from the
  # default branch only. `latest` belongs to the release workflow.
  docker:
    name: Docker
    needs: ci
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/_docker.yml
    with:
      push: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') }}
    secrets: inherit
