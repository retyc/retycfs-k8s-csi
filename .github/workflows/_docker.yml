name: _Docker

on:
  workflow_call:
    inputs:
      push:
        description: "Push the image; false only builds it (branches, pull requests)"
        required: false
        type: boolean
        default: true

jobs:
  docker:
    name: ${{ inputs.push && 'Push image' || 'Build image' }}
    runs-on: ubuntu-latest
    # Capped by the caller's: id-token for the keyless cosign signatures (Sigstore OIDC).
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      # Full history and tags: `git describe` below needs them.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Only for the final stage's apt-get on the foreign platform (a cached layer most of the
      # time): the Go build cross-compiles from the build platform.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Needed to push, and kept on build-only runs for the retyc-cli base image: it is public
      # on ghcr.io, but logging in keeps the build working should the package ever go private,
      # and lifts any anonymous rate limit.
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Push only: the secrets are not available to a pull request from a fork.
      - name: Log in to Docker Hub
        if: inputs.push && github.event_name != 'workflow_dispatch'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Tags follow from the event, never from the caller:
      #   push of a v1.2.3 tag      -> v1.2.3 + latest
      #   push of a v1.2.3-rc1 tag  -> v1.2.3-rc1 only (a pre-release never moves latest)
      #   push to the default branch -> its name (master)
      #   manual run, any ref       -> commit-<short sha>, GHCR only: a one-off
      #                                build never moves a release or branch tag
      #   anything else             -> no tag (build only)
      - name: Image tags
        id: tags
        uses: docker/metadata-action@v6
        with:
          images: |
            name=ghcr.io/retyc/retycfs-k8s-csi
            name=retyc/retycfs-k8s-csi,enable=${{ github.event_name != 'workflow_dispatch' }}
          tags: |
            type=semver,pattern={{raw}},enable=${{ github.event_name == 'push' }}
            type=ref,event=branch,enable=${{ github.event_name == 'push' && github.ref_name == github.event.repository.default_branch }}
            type=sha,prefix=commit-,enable=${{ github.event_name == 'workflow_dispatch' }}

      # The version compiled into the driver (GetPluginInfo) and set as the OCI label is not the
      # image tag: an untagged build gets a `git describe` version (v1.2.3-4-gabc1234), from the
      # driver's v* tags only — the chart's retycfs-csi-* release tags live in the same repository.
      # A tag push uses the pushed tag itself, which `git describe` could not tell from another
      # tag on the same commit.
      - name: Image version and build date
        id: meta
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="$GITHUB_REF_NAME"
          else
            version="$(git describe --tags --always --match 'v*')"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ inputs.push }}
          provenance: ${{ inputs.push && 'mode=max,version=v1' || 'false' }}
          sbom: ${{ inputs.push }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
            CREATED=${{ steps.meta.outputs.created }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up cosign
        if: inputs.push
        uses: sigstore/cosign-installer@v4.1.2

      # The repositories just pushed (the tags without their tag): GHCR and Docker Hub, or GHCR only
      # on a manual run. Every one holds the same digest, but a signature or an attestation lives
      # beside its image: each registry gets its own. cosign reads the credentials of the logins above.
      - name: Pushed repositories
        if: inputs.push
        id: repos
        env:
          TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          repos=$(echo "$TAGS" | sed '/^$/d; s/:[^:/]*$//' | sort -u | tr '\n' ' ')
          if [ -z "$repos" ]; then
            echo "::error::pushed without tags, nothing to sign"
            exit 1
          fi
          echo "repos=$repos" >> "$GITHUB_OUTPUT"

      # Keyless signature (Sigstore, GitHub OIDC identity of this workflow), by digest so a tag
      # cannot be swapped in between. --recursive also signs each platform's manifest, for a pull
      # by platform digest. Check with:
      #   cosign verify ghcr.io/retyc/retycfs-k8s-csi:<tag> \
      #     --certificate-identity https://github.com/retyc/retycfs-k8s-csi/.github/workflows/_docker.yml@refs/tags/<tag> \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - name: Sign
        if: inputs.push
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          REPOS: ${{ steps.repos.outputs.repos }}
        run: |
          for repo in $REPOS; do
            cosign sign --yes --recursive "$repo@$DIGEST"
          done

      # The SBOM and SLSA provenance buildx attached to the image are not signed: the same documents
      # are attached again as signed in-toto attestations, on each platform's manifest (they
      # describe one platform each). Check with cosign verify-attestation --type spdxjson or
      # slsaprovenance1, same identity as above, on the platform digest.
      - name: Attest SBOM and provenance
        if: inputs.push
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          REPOS: ${{ steps.repos.outputs.repos }}
        run: |
          set -euo pipefail
          first=${REPOS%% *}
          dir=$(mktemp -d)
          # "<os>/<arch>[/<variant>] <digest>" per platform; buildx's attestation manifests have
          # the platform unknown/unknown.
          docker buildx imagetools inspect "$first@$DIGEST" --format '{{json .Manifest}}' |
            jq -r '.manifests[] | select(.platform.os != "unknown")
              | "\(.platform.os)/\(.platform.architecture)\(if .platform.variant then "/" + .platform.variant else "" end) \(.digest)"' |
          while read -r platform digest; do
            name=${platform//\//-}
            docker buildx imagetools inspect "$first@$DIGEST" \
              --format "{{json (index .SBOM \"$platform\").SPDX}}" > "$dir/$name.sbom.json"
            docker buildx imagetools inspect "$first@$DIGEST" \
              --format "{{json (index .Provenance \"$platform\").SLSA}}" > "$dir/$name.provenance.json"
            for f in "$dir/$name.sbom.json" "$dir/$name.provenance.json"; do
              if [ "$(jq -r 'type' "$f")" != object ]; then
                echo "::error::no buildx attestation for $platform in $f"
                exit 1
              fi
            done
            for repo in $REPOS; do
              cosign attest --yes --type spdxjson --predicate "$dir/$name.sbom.json" "$repo@$digest"
              cosign attest --yes --type slsaprovenance1 --predicate "$dir/$name.provenance.json" "$repo@$digest"
            done
          done
